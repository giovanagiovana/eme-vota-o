<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dilema da Eme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        body {
            background-color: #ff69b4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: white;
            padding: 20px 20px 80px 20px; /* Espaço extra embaixo para a marca d'água */
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            text-shadow: 3px 3px 0px #db2777;
            margin-bottom: 10px;
        }

        .votação {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .opção {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 30px;
            width: 260px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .moldura {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #fff;
            background-color: #f0f0f0;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .coracao-animado {
            position: absolute;
            color: #ff1493;
            font-size: 22px;
            z-index: 1;
            bottom: 50px;
            opacity: 0;
            animation: flutuar 3s infinite linear;
        }

        @keyframes flutuar {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-300px) translateX(15px) rotate(20deg); opacity: 0; }
        }

        button {
            background: linear-gradient(to right, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); }

        .contador {
            display: block;
            margin-top: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #db2777;
