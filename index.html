<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dilema da Eme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        body {
            background-color: #ff69b4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            text-shadow: 3px 3px 0px #db2777;
            margin-bottom: 10px;
        }

        .votação {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .opção {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 30px;
            width: 280px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .moldura {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 350px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #fff;
            background-color: #f0f0f0;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .coracao-animado {
            position: absolute;
            color: #ff1493;
            font-size: 22px;
            z-index: 1;
            bottom: 50px;
            opacity: 0;
            animation: flutuar 3s infinite linear;
        }

        @keyframes flutuar {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-300px) translateX(15px) rotate(20deg); opacity: 0; }
        }

        button {
            background: linear-gradient(to right, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); }

        .contador {
            display: block;
            margin-top: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #db2777;
        }
    </style>
</head>
<body>

    <h1>Com quem a Eme deve ficar?</h1>
    
    <div class="votação">
        <div class="opção">
            <div class="coracao-animado" style="left:10%; animation-delay: 0s;">❤️</div>
            <div class="coracao-animado" style="left:80%; animation-delay: 1s;">💖</div>
            <div class="moldura"><img src="image_14b624.jpg"></div>
            <h2>Gui</h2>
            <button onclick="votar('gui')">Votar no Gui</button>
            <span id="votos-gui" class="contador">0 Votos</span>
        </div>

        <div class="opção">
            <div class="coracao-animado" style="left:15%; animation-delay: 0.5s;">❤️</div>
            <div class="coracao-animado" style="left:75%; animation-delay: 1.5s;">💖</div>
            <div class="moldura"><img src="image_14b61c.jpg"></div>
            <h2>Davi</h2>
            <button onclick="votar('davi')">Votar no Davi</button>
            <span id="votos-davi" class="contador">0 Votos</span>
        </div>

        <div class="opção">
            <div class="coracao-animado" style="left:20%; animation-delay: 0.8s;">❤️</div>
            <div class="coracao-animado" style="left:70%; animation-delay: 1.8s;">💖</div>
            <div class="moldura"><img src="eme.jpg"></div>
            <h2>Manu</h2>
            <button onclick="votar('manu')">Votar na Manu</button>
            <span id="votos-manu" class="contador">0 Votos</span>
        </div>
    </div>

    <script>
        // Carrega os votos salvos ou começa do zero se for a primeira vez
        let g = parseInt(localStorage.getItem('votosGui')) || 0;
        let d = parseInt(localStorage.getItem('votosDavi')) || 0;
        let m = parseInt(localStorage.getItem('votosManu')) || 0;

        // Atualiza a tela com os valores salvos assim que a página abre
        document.getElementById('votos-gui').innerText = g + " Votos";
        document.getElementById('votos-davi').innerText = d + " Votos";
        document.getElementById('votos-manu').innerText = m + " Votos";

        function votar(nome) {
            if(nome === 'gui') {
                g++;
                localStorage.setItem('votosGui', g); // Salva no navegador
                document.getElementById('votos-gui').innerText = g + " Votos";
            } else if(nome === 'davi') {
                d++;
                localStorage.setItem('votosDavi', d); // Salva no navegador
                document.getElementById('votos-davi').innerText = d + " Votos";
            } else if(nome === 'manu') {
                m++;
                localStorage.setItem('votosManu', m); // Salva no navegador
                document.getElementById('votos-manu').innerText = m + " Votos";
            }
        }
    </script>
</body>
</html>
