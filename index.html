<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dilema da Eme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        body {
            background-color: #ff69b4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            text-shadow: 3px 3px 0px #db2777;
            margin-bottom: 10px;
        }

        .votação {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .opção {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 30px;
            width: 320px;
            position: relative; /* Necessário para os corações ficarem em volta */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        /* Moldura da Foto */
        .moldura {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            border: 5px solid #fff;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Animação dos Corações */
        .coracao-animado {
            position: absolute;
            color: #ff1493;
            font-size: 25px;
            z-index: 1;
            bottom: 50px;
            opacity: 0;
            animation: flutuar 3s infinite linear;
        }

        @keyframes flutuar {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-350px) translateX(20px) rotate(20deg); opacity: 0; }
        }

        /* Botão e Contador */
        button {
            background: linear-gradient(to right, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
        }

        button:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .contador {
            display: block;
            margin-top: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #db2777;
        }
    </style>
</head>
<body>

    <h1>Com quem a Eme deve ficar?</h1>
    <p>Os corações não mentem! ✨</p>
    
    <div class="votação">
        <div class="opção">
            <div class="coracao-animado" style="left:10%; animation-delay: 0s;">❤️</div>
            <div class="coracao-animado" style="left:80%; animation-delay: 1s;">💖</div>
            <div class="coracao-animado" style="left:40%; animation-delay: 2s;">💗</div>
            
            <div class="moldura">
                <img src="image_14b624.jpg">
            </div>
            <h2>Gui</h2>
            <button onclick="votar('gui')">Votar no Gui</button>
            <span id="votos-gui" class="contador">0 Votos</span>
        </div>

        <div class="opção">
            <div class="coracao-animado" style="left:15%; animation-delay: 0.5s;">❤️</div>
            <div class="coracao-animado" style="left:75%; animation-delay: 1.5s;">💖</div>
            <div class="coracao-animado" style="left:45%; animation-delay: 2.5s;">💝</div>

            <div class="moldura">
                <img src="image_14b61c.jpg">
            </div>
            <h2>Davi</h2>
            <button onclick="votar('davi')">Votar no Davi</button>
            <span id="votos-davi" class="contador">0 Votos</span>
        </div>
    </div>

    <script>
        let g = 0;
        let d = 0;
        function votar(nome) {
            if(nome === 'gui') {
                g++;
                document.getElementById('votos-gui').innerText = g + " Votos";
            } else {
                d++;
                document.getElementById('votos-davi').innerText = d + " Votos";
            }
        }
    </script>

</body>
</html>
